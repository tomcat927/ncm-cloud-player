name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ncm-cloud-player-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode signing key
        run: |
          mkdir -p signing
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > signing/release.p12

      - name: Prepare version
        id: ver
        run: |
          VERSION_NAME="0.1.0"
          STAMP=$(date -u +%Y%m%d%H%M%S)
          TAG="v$VERSION_NAME-$STAMP"
          VERSION_CODE=$(date -u +%s)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          RELEASE_STORE_FILE: signing/release.p12
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PreleaseVersionCode=${{ steps.ver.outputs.version_code }} -PreleaseVersionName=${{ steps.ver.outputs.version_name }}

      - name: Generate checksum and manifest
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          BASENAME=$(basename "$APK")
          sha256sum "$APK" | awk '{print $1}' > "$APK.sha256"
          cat > app/build/outputs/apk/release/latest.json <<EOF
          {
            "version_code": ${{ steps.ver.outputs.version_code }},
            "tag_name": "${{ steps.ver.outputs.tag }}",
            "apk": "https://gh-proxy.com/https://github.com/tomcat927/ncm-cloud-player/releases/download/${{ steps.ver.outputs.tag }}/$BASENAME",
            "github_apk": "https://github.com/tomcat927/ncm-cloud-player/releases/download/${{ steps.ver.outputs.tag }}/$BASENAME",
            "apk_sha256": "https://gh-proxy.com/https://github.com/tomcat927/ncm-cloud-player/releases/download/${{ steps.ver.outputs.tag }}/$BASENAME.sha256",
            "github_apk_sha256": "https://github.com/tomcat927/ncm-cloud-player/releases/download/${{ steps.ver.outputs.tag }}/$BASENAME.sha256",
            "release_url": "https://github.com/tomcat927/ncm-cloud-player/releases/tag/${{ steps.ver.outputs.tag }}",
            "release_notes": "ncm-cloud-player ${{ steps.ver.outputs.version_name }}"
          }
          EOF

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ncm-cloud-player-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
            app/build/outputs/apk/release/latest.json
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
            app/build/outputs/apk/release/latest.json
          generate_release_notes: true
